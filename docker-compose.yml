services:
  postgres:
    image: postgres:16-alpine
    container_name: anil-postgres
    environment:
      POSTGRES_DB: anil_gold
      POSTGRES_USER: anil
      POSTGRES_PASSWORD: anil
    ports:
      - "5432:5432"
    volumes:
      - anil_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anil -d anil_gold"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: anil-mongo
    ports:
      - "27017:27017"
    volumes:
      - anil_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anil_pg_data:
  anil_mongo_data:
